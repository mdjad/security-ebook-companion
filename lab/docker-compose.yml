# ─────────────────────────────────────────────────────────────
#  LABORATOIRE DU MANUEL — Cybersécurité à l'ère de l'IA
#
#  Hôte : macOS Apple Silicon (arm64) — Docker Desktop.
#
#  Démarrage :
#    docker compose up -d                          # cibles + passerelle edge
#    docker compose --profile pentest up -d         # + poste d'attaque Kali
#    docker compose --profile web up -d            # + scanner ZAP
#    docker compose --profile devsecops up -d      # + outils DevSecOps + Vault
#
#  Réseaux :
#    seclab          : attaquant / outils — accès Internet
#    seclab-internal : cibles vulnérables — AUCUN accès Internet
#
#  NB Docker Desktop macOS : les ports publiés d'un conteneur sur un
#  réseau internal:true ne sont PAS joignables depuis l'hôte. L'accès
#  hôte → cibles passe donc par le service `edge` (sur les deux réseaux).
# ─────────────────────────────────────────────────────────────

name: security-ebook-lab

networks:
  seclab:
    driver: bridge
  seclab-internal:
    driver: bridge
    internal: true

services:
  # ── Cibles vulnérables (réseau interne, sans Internet) ──────
  dvwa:
    image: cytopia/dvwa:php-8.1
    container_name: seclab-dvwa
    restart: unless-stopped
    networks: [seclab-internal]
    environment:
      MYSQL_HOSTNAME: dvwa-db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: dvwa
      MYSQL_USERNAME: dvwa
      MYSQL_PASSWORD: dvwa_pwd_lab
    depends_on:
      dvwa-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/login.php >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  dvwa-db:
    image: mariadb:11
    container_name: seclab-dvwa-db
    restart: unless-stopped
    networks: [seclab-internal]
    environment:
      MARIADB_ROOT_PASSWORD: root_pwd_lab
      MARIADB_DATABASE: dvwa
      MARIADB_USER: dvwa
      MARIADB_PASSWORD: dvwa_pwd_lab
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  juice-shop:
    image: bkimminich/juice-shop
    container_name: seclab-juice-shop
    restart: unless-stopped
    networks: [seclab-internal]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3000/rest/products/search?q=').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  vuln-host:
    build: ./images/vuln-host
    container_name: seclab-vuln-host
    restart: unless-stopped
    networks: [seclab-internal]
    cap_add: [NET_ADMIN, NET_RAW]     # iptables/ufw (Ch17 Ex2, Ch21 Ex1)
    volumes:
      - ./datasets:/lab/datasets:ro   # fixtures Ch06 (auth.log, liste_officielle.txt)
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -qE ':(22|21|80|3306) ' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  vuln-api:
    build: ./images/vuln-api
    container_name: seclab-vuln-api
    restart: unless-stopped
    networks: [seclab-internal]
    environment:
      VULN_MODE: ${VULN_MODE:-vulnerable}   # vulnerable | fixed
      RATE_LIMIT: ${RATE_LIMIT:-20}          # requêtes / minute avant 429
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web-lab:
    build: ./images/web-lab
    container_name: seclab-web-lab
    restart: unless-stopped
    networks: [seclab-internal]
    environment:
      SECURITY_HEADERS: ${SECURITY_HEADERS:-off}   # off | on (HSTS/CSP/nosniff)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Passerelle hôte → cibles (seul chemin publié vers l'interne) ──
  edge:
    image: nginx:1.27-alpine
    container_name: seclab-edge
    restart: unless-stopped
    networks: [seclab, seclab-internal]
    ports:
      - "127.0.0.1:${DVWA_PORT:-18081}:8081"
      - "127.0.0.1:${JUICE_PORT:-18082}:8082"
      - "127.0.0.1:${VULNAPI_PORT:-18083}:8083"
      - "127.0.0.1:${WEBLAB_PORT:-18084}:8084"
    volumes:
      - ./images/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dvwa:
        condition: service_healthy
      juice-shop:
        condition: service_healthy
      vuln-api:
        condition: service_healthy
      web-lab:
        condition: service_healthy

  # ── IDS réseau (Ch21 Ex2) ───────────────────────────────────
  suricata:
    build: ./images/suricata          # jasonish/suricata + ping + netcat
    container_name: seclab-suricata
    restart: unless-stopped
    networks: [seclab-internal]        # voit le trafic interne (cibles)
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: ["tail", "-f", "/dev/null"]   # suricata lancé par le script de validation
    # Bind mount : écrase le volume anonyme de l'image (VOLUME /etc/suricata)
    # qui, sinon, masquerait local.rules par un contenu périmé.
    volumes:
      - ./images/suricata/local.rules:/etc/suricata/local.rules:ro
    healthcheck:
      test: ["CMD-SHELL", "suricata -V >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Poste d'attaque Kali (profil pentest) ───────────────────
  kali:
    build: ./images/pentest-toolbox
    container_name: seclab-kali
    profiles: ["pentest"]
    restart: unless-stopped
    networks: [seclab, seclab-internal]      # pivot : attaquant sur les deux réseaux
    cap_add: [NET_RAW, NET_ADMIN]            # nmap -O, tcpdump, modules Metasploit
    ports:
      - "127.0.0.1:${KALI_SSH_PORT:-2222}:22"   # SSH optionnel (pivot / socat)
    volumes:
      - ./scripts:/lab/scripts:ro
      - ./datasets:/lab/datasets:ro
    tty: true
    stdin_open: true
    depends_on:
      vuln-host:
        condition: service_healthy
      vuln-api:
        condition: service_healthy

  # ── Scanner web ZAP (profil web) ────────────────────────────
  zap:
    image: zaproxy/zap-stable
    container_name: seclab-zap
    profiles: ["web"]
    restart: unless-stopped
    networks: [seclab, seclab-internal]     # doit atteindre les cibles
    ports:
      - "127.0.0.1:${ZAP_PORT:-8090}:8080"
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080",
              "-config", "api.key=${ZAP_API_KEY:-seclab-zap-key}",
              # API accessible depuis l'hôte (par défaut : localhost uniquement)
              "-config", "api.addrs.addr.name=.*",
              "-config", "api.addrs.addr.regex=true"]
    volumes:
      - ./scripts:/lab/scripts:ro
    depends_on:
      vuln-api:
        condition: service_healthy
      web-lab:
        condition: service_healthy

  # ── DevSecOps (profil devsecops) ─────────────────────────────
  devsecops-toolbox:
    build: ./images/devsecops-toolbox
    container_name: seclab-devsecops
    profiles: ["devsecops"]
    restart: unless-stopped
    networks: [seclab]
    # ⚠ docker.sock = accès root au daemon hôte. Labo uniquement, jamais en prod.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./apps:/lab/apps:ro
      - ./scripts:/lab/scripts:ro
      - ./datasets:/lab/datasets:ro
    tty: true
    stdin_open: true

  vault:
    image: hashicorp/vault:latest
    container_name: seclab-vault
    profiles: ["devsecops"]
    restart: unless-stopped
    networks: [seclab]
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
    command: ["server", "-dev"]
    cap_add: [IPC_LOCK]
