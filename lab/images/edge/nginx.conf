# ─────────────────────────────────────────────────────────────
#  EDGE — Passerelle hôte → cibles du réseau interne
#
#  Seul service à publier des ports sur l'hôte (127.0.0.1).
#  Reverse-proxy vers les cibles par nom de conteneur.
# ─────────────────────────────────────────────────────────────

server {
    listen 8081;
    location / {
        proxy_pass http://dvwa:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

